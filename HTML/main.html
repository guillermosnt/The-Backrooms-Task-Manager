<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/main.css">
    <link rel="icon" href="../IMAGES/async_favicon.jpg" type="image/x-icon">
    <title>Async Research Institute</title>

</head>

<!-- Shift + ALT + F para ordenar el código -->

<body>

    <div class="contenedor-superior">


        <div class="titulo">
            <h2>Async Level Manager</h2>
            <p>Los registros se actualizan constantemente. Completa cada tarea antes de continuar al siguiente nivel.
            </p>
        </div>

        <h2 class="texto-audio">Backrooms (2026) | Background Music | Full OST</h2>

        <div class="audio">
            <audio controls>
                <source src="../AUDIO/Backrooms (2026) _ Background Music _ Full OST [oGec-NtOg9Y].mp3"
                    type="audio/mpeg">
                Tu navegador no soporta audio.
            </audio>
        </div>

        <div class="panel-add">
            <input id="inputTarea" type="text" placeholder="Inserta aqui la tarea...">
            <button id="btnAñadir">Añadir</button>
        </div>

    </div>

    <div class="contenedor-inferior">

        <div class="tareas">
            <h2>Tareas añadidas al programa</h2>

            <div id="listado-tareas">

                

            </div>

        </div>

    </div>

    <script src="../JS/tareas.js"></script>

</body>

</html>
